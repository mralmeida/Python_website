{% extends "base.html" %}
{% block title %}Roles | ContactDesk{% endblock %}
{% block content %}
<div class="page-header">
    <div><p class="page-eyebrow">Directory settings</p><h1>Roles <span class="text-secondary fs-5 fw-normal">({{ count }})</span></h1><p class="page-subtitle">Manage the roles available in your contact directory.</p></div>
    <div class="page-actions"><a href="{{ url_for('role_new') }}" class="btn btn-primary"><i class="bi bi-plus-lg me-1" aria-hidden="true"></i> Add role</a></div>
</div>
<div class="table-panel"><div class="table-container">
<table class="datatable table align-middle">
<thead><tr><th>ID</th><th>Name</th><th>Actions</th></tr></thead><tbody>
{% for item in roles %}
<tr><td class="text-secondary">{{ item[0] }}</td><td class="fw-semibold">{{ item[1] }}</td><td class="d-flex gap-3"><a href="{{ url_for('role_edit', id=item[0]) }}" class="edit-icon" aria-label="Edit {{ item[1] }}" title="Edit"><i class="bi bi-pencil-square"></i></a><a href="{{ url_for('role_delete', id=item[0]) }}" class="delete-icon" aria-label="Deactivate {{ item[1] }}" title="Deactivate" onclick="return confirm('Deactivate this record? It will no longer appear in active lists.');"><i class="bi bi-person-dash"></i></a></td></tr>
{% endfor %}
</tbody></table></div></div>
{% endblock %}
