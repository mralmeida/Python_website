{% extends "base.html" %}

{% block content %}
    <h1>Roles ({{ count }})</h1>

    <p>
        <a href="/role/new" class="new-icon" title="Add Role"><i class="bi bi-plus-circle-fill"></i></a><b>Add new Role</b>
    </p>

    <table id="contactsTable" class="datatable">
        <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Edit</th>
                    <th>Delete</th>
                </tr>
        </thead>
        <tbody>
            {% for r in roles %}
            <tr>
                <td>{{ r[0] }}</td>
                <td>{{ r[1] }}</td>
                <td><a href="/role/edit/{{ r[0] }}" class="edit-icon"><i class="bi bi-pencil-square"></i></a></td>
                <td><a href="/role/delete/{{ r[0] }}"><i class="bi bi-trash"></i></a></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
