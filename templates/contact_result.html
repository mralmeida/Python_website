<script>
let seconds = 10;

const timer = setInterval(function() {
    seconds--;

    document.getElementById("countdown").innerText = seconds;

    if (seconds <= 0) {
        clearInterval(timer);
        window.location.href = "{{ url_for('messages') }}";
    }
}, 1000);
</script>

{% extends "base.html" %} {% block content %}
<b>Thank you!</b><br>
Name: {{ name }}<br>
Email: {{ email }}<br>
Message: {{ message }}<br>
Your message has been saved in the database.
<p>
    Redirecting in
    <span id="countdown">10</span>
    seconds...
</p>
{% endblock %}
