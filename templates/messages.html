{% extends "base.html" %}
{% block content %}

<form method="POST" action="/delete-messages">
    <h1>{{ count }} Messages recovered</h1>
    <table border="1" cellpadding="2">
        <tr>
            <th>Delete?</th>
            <!--<th>ID</th>-->
            <th>Name</th>
            <th>Email</th>
            <th>Message</th>
            <th>Action</th>
        </tr>

        {% for msg in messages %}
        <tr>
            <td>
                <input type="checkbox" name="delete_ids" value="{{ msg[0] }}">
            </td>
            <!--<td>{{ msg[0] }}</td>-->
            <td>{{ msg[1] }}</td>
            <td><a href="mailto:{{ msg[2] }}">{{ msg[2] }}</a></td>
            <td>{{ msg[3] }}</td>
            <td><a href="/edit/{{ msg[0] }}"> <button type="button">Edit</button> </a></td>
        </tr>
        {% endfor %}
    </table>

    <p>
        <!--<button type="submit">Delete Selected</button>-->
        <button type="submit" id="deleteButton" disabled>Delete Selected</button>
    </p>
</form>
<script>
document.addEventListener("DOMContentLoaded", function() {

    const checkboxes = document.querySelectorAll(
        'input[name="delete_ids"]'
    );

    const deleteButton = document.getElementById("deleteButton");

    function updateButtonState() {
        const checked = document.querySelectorAll(
            'input[name="delete_ids"]:checked'
        );

        deleteButton.disabled = checked.length === 0;
    }

    checkboxes.forEach(function(checkbox) {
        checkbox.addEventListener("change", updateButtonState);
    });

    updateButtonState();
});
</script>

{% endblock %}
