{% extends "base.html" %}
{% block content %}
<h1>Import CSV</h1>

<form method="POST" enctype="multipart/form-data">
    <input type="file" name="csvfile" accept=".csv">
    <button type="submit">Upload</button>
</form>
<br><br><br>
<a href="{{ url_for('static',filename='files/model.csv') }}"><img src="{{ url_for('static',filename='images/csv-icon.png') }}" alt="Download the template file here"></a>
{% endblock %}}
